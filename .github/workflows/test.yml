name: Bridge tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test]"
      - run: python tools/build_native.py  # the Gerber tests then run on both the C and numpy paths
      - run: python -m pytest -q

  macos-python39:
    # Python 3.9 is supported because KiCad for macOS ships 3.9.13, so it is tested there.
    # setup-python has no 3.9 for Apple silicon; uv installs a standalone build.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.9 .venv
      - run: uv pip install --python .venv -e ".[test]"
      - run: .venv/bin/python tools/build_native.py
      - run: .venv/bin/python -m pytest -q

  blender:
    # The add-on against real Blender builds, headless. Blender exits 0 when a script
    # raises unless --python-exit-code is set.
    # Not ubuntu-latest: GitHub's Ubuntu 26.04 image installs amd64v3 packages only, and
    # the KiCad PPA builds KiCad for plain amd64, so apt finds no KiCad 10 there.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        blender: ['5.1.2', '5.2.2']
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for Blender and a software OpenGL
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb libgl1 libegl1 libglx-mesa0 libgl1-mesa-dri \
            libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6
      - name: KiCad 10 (its kicad-cli makes the mask, silkscreen and model exports)
        run: |
          # Asked for by version, so apt fails here rather than install the archive's
          # KiCad 9, whose kicad-cli cannot load the KiCad 10 test boards.
          # Launchpad answers 503 for minutes at a time, so a failed fetch is tried again.
          for attempt in 1 2 3 4 5; do
            sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases \
              && sudo apt-get install -y -q --no-install-recommends 'kicad=10.*' && break
            [ "$attempt" = 5 ] && exit 1
            echo "::warning::KiCad 10 not fetched (attempt $attempt of 5); trying again in 60 s"
            sleep 60
          done
          kicad-cli version
      - uses: actions/cache@v4
        with:
          path: blender
          key: blender-${{ matrix.blender }}-linux-x64
      - name: Blender ${{ matrix.blender }}
        run: |
          if [ ! -x blender/blender ]; then
            series=$(echo "${{ matrix.blender }}" | cut -d. -f1,2)
            url="https://download.blender.org/release/Blender${series}/blender-${{ matrix.blender }}-linux-x64.tar.xz"
            # download.blender.org drops out now and then: a failed download is tried again.
            for attempt in 1 2 3 4 5; do
              curl -sfL -o blender.tar.xz "$url" && tar xJf blender.tar.xz && break
              [ "$attempt" = 5 ] && exit 1
              echo "::warning::Blender not downloaded (attempt $attempt of 5); trying again in 60 s"
              sleep 60
            done
            rm blender.tar.xz
            mv "blender-${{ matrix.blender }}-linux-x64" blender
          fi
          blender/blender --version | head -1
      - run: python3 tools/build_native.py
      - name: Headless Blender tests
        run: |
          for script in tests/blender/run_*.py; do
            echo "::group::$script"
            xvfb-run -a blender/blender --background --factory-startup --python-exit-code 1 --python "$script"
            echo "::endgroup::"
          done
