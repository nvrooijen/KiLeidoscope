<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" role="img">
<title>KiLeidoscope bridge architecture</title>
<desc>KiCad on the left feeds the KiLeidoscope bridge in the middle through read-only IPC polls every 200 ms; the bridge sends binary frames over local TCP to the Blender add-on on the right. Clicks in Blender travel back through the bridge, which selects the item in KiCad. A live board copy under the bridge feeds kicad-cli, which gives Blender mask, silkscreen and 3D models and runs KiCad's DRC; the bridge places each DRC finding on the live board and Blender lists and draws them in its DRC tab.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
text { font-family: "Segoe UI", "Inter", "Helvetica Neue", Arial, sans-serif; dominant-baseline: central; }
.th { font-size: 14px; font-weight: 500; }
.ts { font-size: 12px; font-weight: 400; }
.lbl { fill: #B7BDC8; }
.arr { stroke: #9198A1; stroke-width: 1.5; fill: none; }
.back { stroke: #D85A30; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
</style>
</defs>
<rect width="100%" height="100%" fill="#0D1117"/>
<rect x="40" y="40" width="120" height="160" rx="8" fill="#314CB0" stroke="#314CB0" stroke-width="0.5"/>
<text class="th" x="100" y="110" text-anchor="middle" fill="#FFFFFF">KiCad 10</text>
<text class="ts" x="100" y="132" text-anchor="middle" fill="#D6DDF5">IPC API server</text>
<rect x="270" y="40" width="140" height="160" rx="8" fill="#CDEBC5" stroke="#639922" stroke-width="0.5"/>
<text class="th" x="340" y="100" text-anchor="middle" fill="#173404">KiLeidoscope</text>
<text class="th" x="340" y="118" text-anchor="middle" fill="#173404">bridge</text>
<text class="ts" x="340" y="140" text-anchor="middle" fill="#3B6D11">Poll, diff, encode</text>
<text class="ts" x="340" y="158" text-anchor="middle" fill="#3B6D11">Place findings</text>
<rect x="520" y="40" width="120" height="160" rx="8" fill="#E87D0D" stroke="#E87D0D" stroke-width="0.5"/>
<text class="th" x="580" y="100" text-anchor="middle" fill="#412402">Blender</text>
<text class="th" x="580" y="118" text-anchor="middle" fill="#412402">add-on</text>
<text class="ts" x="580" y="140" text-anchor="middle" fill="#633806">Geometry Nodes</text>
<text class="ts" x="580" y="158" text-anchor="middle" fill="#633806">DRC tab</text>
<rect x="270" y="260" width="140" height="56" rx="8" fill="#CDEBC5" stroke="#639922" stroke-width="0.5"/>
<text class="th" x="340" y="278" text-anchor="middle" fill="#173404">Live board copy</text>
<text class="ts" x="340" y="298" text-anchor="middle" fill="#3B6D11">Unsaved edits</text>
<rect x="520" y="260" width="120" height="56" rx="8" fill="#314CB0" stroke="#314CB0" stroke-width="0.5"/>
<text class="th" x="580" y="278" text-anchor="middle" fill="#FFFFFF">kicad-cli</text>
<text class="ts" x="580" y="298" text-anchor="middle" fill="#D6DDF5">Gerber, GLB, DRC</text>
<text class="ts lbl" x="215" y="66" text-anchor="middle">Geometry reads</text>
<text class="ts lbl" x="215" y="82" text-anchor="middle">every 200 ms</text>
<line x1="162" y1="100" x2="266" y2="100" class="arr" marker-end="url(#arrow)"/>
<text class="ts lbl" x="215" y="128" text-anchor="middle">Select in KiCad</text>
<text class="ts lbl" x="215" y="144" text-anchor="middle">(the only write)</text>
<line x1="268" y1="162" x2="164" y2="162" class="back" marker-end="url(#arrow)"/>
<text class="ts lbl" x="465" y="66" text-anchor="middle">Binary frames,</text>
<text class="ts lbl" x="465" y="82" text-anchor="middle">local TCP</text>
<line x1="412" y1="100" x2="516" y2="100" class="arr" marker-end="url(#arrow)"/>
<text class="ts lbl" x="465" y="128" text-anchor="middle">Click, Shift+click</text>
<text class="ts lbl" x="465" y="144" text-anchor="middle">select request</text>
<line x1="518" y1="162" x2="414" y2="162" class="back" marker-end="url(#arrow)"/>
<line x1="340" y1="202" x2="340" y2="256" class="arr" marker-end="url(#arrow)"/>
<line x1="412" y1="288" x2="516" y2="288" class="arr" marker-end="url(#arrow)"/>
<line x1="580" y1="258" x2="580" y2="204" class="arr" marker-end="url(#arrow)"/>
<path d="M540 258 V232 H390 V204" class="arr" marker-end="url(#arrow)"/>
<text class="ts lbl" x="466" y="222" text-anchor="middle">DRC report</text>
<line x1="40" y1="352" x2="72" y2="352" class="arr"/>
<text class="ts lbl" x="80" y="352">Board data toward Blender</text>
<line x1="300" y1="352" x2="332" y2="352" class="back"/>
<text class="ts lbl" x="340" y="352">Clicks back to KiCad</text>
</svg>
