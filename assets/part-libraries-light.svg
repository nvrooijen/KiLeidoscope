<text class="ts lbl" x="46" y="248">Blender add-on</text>
<rect x="210" y="30" width="260" height="56" rx="8" fill="#314CB0" stroke="#314CB0" stroke-width="0.5"/>
<text class="th" x="340" y="50" text-anchor="middle" fill="#FFFFFF">KiCad, live</text>
<text class="ts" x="340" y="68" text-anchor="middle" fill="#D6DDF5">footprints: name, value, fields, pins</text>
<rect x="150" y="140" width="170" height="56" rx="8" fill="#CDEBC5" stroke="#639922" stroke-width="0.5"/>
<text class="th" x="235" y="160" text-anchor="middle" fill="#173404">Footprint reader</text>
<text class="ts" x="235" y="178" text-anchor="middle" fill="#3B6D11">kicad_reader.py</text>
<rect x="360" y="140" width="170" height="56" rx="8" fill="#CDEBC5" stroke="#639922" stroke-width="0.5"/>
<text class="th" x="445" y="160" text-anchor="middle" fill="#173404">Frames</text>
<text class="ts" x="445" y="178" text-anchor="middle" fill="#3B6D11">protocol.py</text>
<rect x="50" y="262" width="180" height="56" rx="8" fill="#E87D0D" stroke="#E87D0D" stroke-width="0.5"/>
<text class="th" x="140" y="282" text-anchor="middle" fill="#412402">My parts</text>
<text class="ts" x="140" y="300" text-anchor="middle" fill="#633806">one .blend per part</text>
<rect x="250" y="262" width="180" height="56" rx="8" fill="#E87D0D" stroke="#E87D0D" stroke-width="0.5"/>
<text class="th" x="340" y="282" text-anchor="middle" fill="#412402">Added libraries</text>
<text class="ts" x="340" y="300" text-anchor="middle" fill="#633806">.blend files, folders</text>
<rect x="450" y="262" width="180" height="56" rx="8" fill="#E87D0D" stroke="#E87D0D" stroke-width="0.5"/>
<text class="th" x="540" y="282" text-anchor="middle" fill="#412402">Add-on libraries</text>
<text class="ts" x="540" y="300" text-anchor="middle" fill="#633806">kileidoscope_parts</text>
