<text class="ts" x="340" y="472" text-anchor="middle" fill="#633806">copies as the footprint's models</text>
<rect x="45" y="520" width="132" height="56" rx="8" fill="#E87D0D" stroke="#E87D0D" stroke-width="0.5"/>
