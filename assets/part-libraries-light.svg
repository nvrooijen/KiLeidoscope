<text class="th" x="567" y="540" text-anchor="middle" fill="#412402">Folding</text>
<text class="ts" x="567" y="558" text-anchor="middle" fill="#633806">fold.py</text>
<line x1="320" y1="86" x2="245" y2="138" class="arr" marker-end="url(#arrow)"/>
<line x1="320" y1="168" x2="358" y2="168" class="arr" marker-end="url(#arrow)"/>
<line x1="440" y1="196" x2="440" y2="346" class="arr" marker-end="url(#arrow)"/>
