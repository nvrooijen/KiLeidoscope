<svg xmlns="http://www.w3.org/2000/svg" width="680" height="606" viewBox="0 0 680 606" role="img">
<title>KiLeidoscope part libraries</title>
<desc>KiCad's live API gives each footprint's name, value, fields and pins; the bridge reads them and sends them in its frames. The Blender add-on matches each footprint against My parts, the libraries the user added and the libraries other add-ons offer through the kileidoscope_parts hook, by name, the KiLeidoscope Model field or a library's kls_index; the Parts tab ticks the libraries and saves parts to My parts. A matched part is placed as copies that are the footprint's model objects, an add-on's place is called for its own parts, and X-ray, the cut plane, reflowed solder and folding treat them as KiCad's models.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
text { font-family: "Segoe UI", "Inter", "Helvetica Neue", Arial, sans-serif; dominant-baseline: central; }
.th { font-size: 14px; font-weight: 500; }
.ts { font-size: 12px; font-weight: 400; }
.lbl { fill: #59636E; }
.arr { stroke: #818B98; stroke-width: 1.5; fill: none; }
.group { stroke: #818B98; stroke-width: 0.5; stroke-dasharray: 4 4; fill: none; }
</style>
</defs>
<rect x="30" y="14" width="620" height="86" rx="8" class="group"/>
<text class="ts lbl" x="46" y="30">KiCad</text>
