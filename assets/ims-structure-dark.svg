<text class="ts" x="465" y="68" text-anchor="middle" fill="#D6DDF5">colours, mask plots</text>
<rect x="60" y="140" width="170" height="56" rx="8" fill="#CDEBC5" stroke="#639922" stroke-width="0.5"/>
