<svg xmlns="http://www.w3.org/2000/svg" width="680" height="578" viewBox="0 0 680 578" role="img">
<title>KiLeidoscope IMS mode</title>
<desc>KiCad's live API gives the 2-layer stackup and the copper; a copy of the board file gives its colours and mask plots. The bridge reads both and sends frames to the Blender add-on. With IMS mode on, the add-on keeps KiCad's board thickness, puts the panel's epoxy under F.Cu and fills the rest with a metal base in B.Cu's place; it hides the bottom layers, warns about vias, plated holes and B.Cu copper, and draws the base and epoxy in the cross section, the base as polished metal.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
text { font-family: "Segoe UI", "Inter", "Helvetica Neue", Arial, sans-serif; dominant-baseline: central; }
.th { font-size: 14px; font-weight: 500; }
.ts { font-size: 12px; font-weight: 400; }
.lbl { fill: #B7BDC8; }
.arr { stroke: #9198A1; stroke-width: 1.5; fill: none; }
.group { stroke: #9198A1; stroke-width: 0.5; stroke-dasharray: 4 4; fill: none; }
</style>
</defs>
