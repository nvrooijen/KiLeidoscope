<svg xmlns="http://www.w3.org/2000/svg" width="680" height="578" viewBox="0 0 680 578" role="img">
<title>KiLeidoscope flex mode</title>
<desc>KiCad's live API gives the copper and the drawings and texts on the Flex, Bend and Stiffener layers; a copy of the board file gives the polyimide stack-up; KiCad's own Python computes hatched fills. The bridge builds the flex model, runs the flex checks and sends a flex frame with every snapshot. The Blender add-on plans the fold, makes folded copies of the board bent in Geometry Nodes by handles, places the parts and stiffeners, colours the coverlay and polyimide, lists the checks in the panel, and maps clicks and the cut plane back to the flat board.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
text { font-family: "Segoe UI", "Inter", "Helvetica Neue", Arial, sans-serif; dominant-baseline: central; }
.th { font-size: 14px; font-weight: 500; }
.ts { font-size: 12px; font-weight: 400; }
.lbl { fill: #59636E; }
.arr { stroke: #818B98; stroke-width: 1.5; fill: none; }
.group { stroke: #818B98; stroke-width: 0.5; stroke-dasharray: 4 4; fill: none; }
</style>
</defs>
