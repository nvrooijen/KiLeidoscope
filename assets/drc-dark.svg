<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img">
<title>KiLeidoscope DRC findings path</title>
<desc>KiCad on the left feeds the KiLeidoscope bridge in the middle every 200 ms; the bridge sends one findings frame over local TCP to the Blender add-on on the right, which lists the findings in its DRC tab, puts markers on the board and draws the picked finding in 3D. Select, confirm, dismiss and KiCad DRC travel back from Blender to the bridge; only Select reaches KiCad. Below the bridge, the project's .kileidoscope folder holds the run copies, the bridge's DRC findings file and the confirm and dismiss state. kicad-cli runs DRC on a run copy and returns its report to the bridge, which writes the DRC findings file and watches it.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
text { font-family: "Segoe UI", "Inter", "Helvetica Neue", Arial, sans-serif; dominant-baseline: central; }
.th { font-size: 14px; font-weight: 500; }
.ts { font-size: 12px; font-weight: 400; }
.lbl { fill: #B7BDC8; }
.arr { stroke: #9198A1; stroke-width: 1.5; fill: none; }
.back { stroke: #D85A30; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
</style>
</defs>
<rect width="100%" height="100%" fill="#0D1117"/>
<rect x="40" y="40" width="120" height="160" rx="8" fill="#314CB0" stroke="#314CB0" stroke-width="0.5"/>
<text class="th" x="100" y="110" text-anchor="middle" fill="#FFFFFF">KiCad 10</text>
<text class="ts" x="100" y="132" text-anchor="middle" fill="#D6DDF5">IPC API server</text>
<rect x="290" y="40" width="140" height="160" rx="8" fill="#CDEBC5" stroke="#639922" stroke-width="0.5"/>
<text class="th" x="360" y="92" text-anchor="middle" fill="#173404">KiLeidoscope</text>
<text class="th" x="360" y="110" text-anchor="middle" fill="#173404">bridge</text>
<text class="ts" x="360" y="134" text-anchor="middle" fill="#3B6D11">Convert the report</text>
<text class="ts" x="360" y="152" text-anchor="middle" fill="#3B6D11">Resolve, measure</text>
<text class="ts" x="360" y="170" text-anchor="middle" fill="#3B6D11">on the live board</text>
<rect x="560" y="40" width="120" height="160" rx="8" fill="#E87D0D" stroke="#E87D0D" stroke-width="0.5"/>
<text class="th" x="620" y="92" text-anchor="middle" fill="#412402">Blender</text>
<text class="th" x="620" y="110" text-anchor="middle" fill="#412402">add-on</text>
<text class="ts" x="620" y="134" text-anchor="middle" fill="#633806">DRC tab</text>
<text class="ts" x="620" y="152" text-anchor="middle" fill="#633806">Markers</text>
<text class="ts" x="620" y="170" text-anchor="middle" fill="#633806">Finding in 3D</text>
<rect x="290" y="270" width="140" height="56" rx="8" fill="#CDEBC5" stroke="#639922" stroke-width="0.5"/>
<text class="th" x="360" y="288" text-anchor="middle" fill="#173404">.kileidoscope/</text>
<text class="ts" x="360" y="308" text-anchor="middle" fill="#3B6D11">Board copy, results</text>
<rect x="560" y="270" width="120" height="56" rx="8" fill="#314CB0" stroke="#314CB0" stroke-width="0.5"/>
<text class="th" x="620" y="288" text-anchor="middle" fill="#FFFFFF">kicad-cli</text>
<text class="ts" x="620" y="308" text-anchor="middle" fill="#D6DDF5">pcb drc</text>
<text class="ts lbl" x="225" y="66" text-anchor="middle">Geometry reads</text>
<text class="ts lbl" x="225" y="82" text-anchor="middle">every 200 ms</text>
<line x1="162" y1="100" x2="286" y2="100" class="arr" marker-end="url(#arrow)"/>
<text class="ts lbl" x="225" y="128" text-anchor="middle">Select in KiCad</text>
<text class="ts lbl" x="225" y="144" text-anchor="middle">(the only write)</text>
<line x1="288" y1="162" x2="164" y2="162" class="back" marker-end="url(#arrow)"/>
<text class="ts lbl" x="495" y="66" text-anchor="middle">Findings frame,</text>
<text class="ts lbl" x="495" y="82" text-anchor="middle">local TCP</text>
<line x1="432" y1="100" x2="556" y2="100" class="arr" marker-end="url(#arrow)"/>
<text class="ts lbl" x="495" y="128" text-anchor="middle">Select, confirm,</text>
<text class="ts lbl" x="495" y="144" text-anchor="middle">dismiss, KiCad DRC</text>
<line x1="558" y1="162" x2="434" y2="162" class="back" marker-end="url(#arrow)"/>
<line x1="330" y1="204" x2="330" y2="266" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text class="ts lbl" x="320" y="220" text-anchor="end">Writes run copies,</text>
<text class="ts lbl" x="320" y="236" text-anchor="end">DRC findings;</text>
<text class="ts lbl" x="320" y="252" text-anchor="end">watches the findings</text>
<line x1="432" y1="298" x2="556" y2="298" class="arr" marker-end="url(#arrow)"/>
<text class="ts lbl" x="494" y="284" text-anchor="middle">Board copy</text>
<path d="M600 268 V236 H410 V204" class="arr" marker-end="url(#arrow)"/>
<text class="ts lbl" x="505" y="224" text-anchor="middle">DRC report</text>
<line x1="40" y1="372" x2="72" y2="372" class="arr"/>
<text class="ts lbl" x="80" y="372">Findings toward Blender</text>
<line x1="300" y1="372" x2="332" y2="372" class="back"/>
<text class="ts lbl" x="340" y="372">Clicks from Blender</text>
</svg>
