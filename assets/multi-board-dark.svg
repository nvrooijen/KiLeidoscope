<line x1="340" y1="256" x2="340" y2="316" class="arr" marker-end="url(#arrow)"/>
<line x1="535" y1="256" x2="535" y2="316" class="arr" marker-end="url(#arrow)"/>
<line x1="135" y1="374" x2="135" y2="416" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="374" x2="340" y2="416" class="arr" marker-end="url(#arrow)"/>
<line x1="535" y1="374" x2="535" y2="416" class="arr" marker-end="url(#arrow)"/>
<line x1="135" y1="474" x2="135" y2="516" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="474" x2="340" y2="516" class="arr" marker-end="url(#arrow)"/>
<line x1="535" y1="474" x2="535" y2="516" class="arr" marker-end="url(#arrow)"/>
<path d="M620 546 H662 V68 H626" class="back" marker-end="url(#arrow)"/>
</svg>
